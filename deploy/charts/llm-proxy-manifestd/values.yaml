image:
  repository: ghcr.io/lerenn/llm-proxy-manifestd
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Name of an existing Secret whose keys are exposed as environment variables,
# so ${VAR} references in `config` are resolved at load time.
existingSecret: ""

# Proxy replicas. Without subscription providers (claude/codex) any value is allowed (RollingUpdate).
# With them, >1 is allowed only in the "rolling" topology (see "Rolling updates" below), else render error.
replicaCount: 1

# Pods get this long to finish in-flight streams on shutdown. Adapters (claude/codex)
# are given ADAPTER_SHUTDOWN_TIMEOUT = this value minus 5s (3s preStop sleep + margin) to
# drain in-flight turns before killing the CLI processes, so it always fits in the grace period.
terminationGracePeriodSeconds: 600

resources: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: llm-proxy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional second Ingress exposing the public read-only dashboard on its own
# host. The proxy serves the dashboard at "/" for hosts starting with
# "dashboard." (or exactly `config.dashboard.host`), and only the dashboard:
# /v1/... is not reachable through this host. className and annotations fall
# back to the `ingress` values when empty.
dashboard:
  ingress:
    enabled: false
    host: ""            # e.g. dashboard.llm-proxy.example.com
    className: ""
    annotations: {}
    tls: []

# CLI adapter sidecars, one per subscription provider (see the "Subscription
# providers" guide). Each entry renders, in the same pod: one sidecar container
# listening on 127.0.0.1:<port>, one PVC holding its login at /data/<type> (claude: CLAUDE_CONFIG_DIR, codex: CODEX_HOME), and
# a pool of the same name (upstream_url http://localhost:<port>) merged into
# config.pools. Reference the pool from config.endpoints targets as usual.
# Empty = feature off.
#
# Setting any provider forces replicas: 1 and strategy Recreate, disables the
# service account token and runs every container non-root with a read-only
# root filesystem. Adding or removing a provider restarts the pod.
#
# Adapter sidecars have NO readiness probe: the pod is Ready without logins. Until
# `claude`/`codex login`, endpoints with only that pool return 503; failover
# endpoints fall through to the next target.
# Types: claude, codex (experimental) (sidecar + PVC), api / anthropic-api / openai-api (pool only: no
# container, no PVC; the API key comes from an existing Secret). Only sidecar
# providers force replicas 1 / Recreate / hardening.
#   my-anthropic:
#     type: anthropic-api     # pool protocol: anthropic
#     url: https://api.anthropic.com   # default; no trailing /v1 (client paths already include it)
#     maxConcurrency: 4       # 0 or omitted = unlimited (no limit, no queue)
#     apiKey: {existingSecret: {name: my-secret, key: anthropic-key}}   # required
#     # openai-api works the same (default url https://api.openai.com)
#   # Generic API: one upstream that may speak one or both protocols.
#   #   format: anthropic | openai | [anthropic, openai]   (required; string or list, no duplicates)
#   #   url: required (no trailing /v1)
#   #   auth: bearer | x-api-key   (optional; default x-api-key for anthropic pools, bearer for openai)
#   # One format -> one pool named <name>. Several formats -> pools <name>-anthropic and
#   # <name>-openai in the concurrency group <name>: they share ONE slot limit and ONE queue
#   # (maxConcurrency: 1 = one request at a time across both protocols).
#   nevermetered:
#     type: api
#     format: [anthropic, openai]
#     url: https://api.nevermetered.com
#     maxConcurrency: 1
#     auth: bearer
#     apiKey: {existingSecret: {name: my-secret, key: nevermetered}}
# providers:
#   claude-subscription:
#     type: claude            # claude | codex | api | anthropic-api | openai-api
#     maxConcurrency: 4       # pool max_concurrency; 0 or omitted = unlimited
#     # port: 9100            # default: providersBasePort + index in name order
#     # storage: {size: 1Gi, storageClass: ""}   # overrides providerStorage
#     # resources: {}         # overrides adapters.<type>.resources
#     # env: []               # extra container env entries
providers: {}

# First loopback port assigned to providers (sorted by name, +1 each).
providersBasePort: 9100

# Defaults for each provider's login volume (ReadWriteOnce).
providerStorage:
  size: 1Gi
  storageClass: ""

# Rolling updates (proxy Deployment strategy), decided by where the subscription adapters run and
# whether a shared limiter/queue exists:
#   - no claude/codex provider ........................ RollingUpdate (surge 1, unavailable 0), replicaCount replicas
#   - adapters.mode=sidecar + claude/codex ............ replicas 1, Recreate (RWO login volumes in the proxy pod)
#   - adapters.mode=separate, no shared limiter ....... replicas 1, Recreate (a surge pod would double the limits)
#   - adapters.mode=separate AND (valkey.enabled or config.coordination set)
#         ............................................. RollingUpdate (surge 1, unavailable 0), replicaCount replicas
# `separate`: each claude/codex provider gets its own Deployment (1 replica, Recreate, its login PVC)
# and ClusterIP Service <fullname>-<provider>; the proxy pod then has no PVC and no adapter container.
# Adapters then listen on the pod IP, so they REQUIRE a shared token: the keys-manager init container
# creates the Secret <fullname>-adapter-token (key `token`, never overwritten), the proxy sends it as
# the pools' api key (Authorization: Bearer) and the adapters reject anything else with 401 (/ready
# excepted). Sidecar mode is unchanged (loopback, no token). Adapters never gate the proxy's readiness.
adapters:
  mode: sidecar   # sidecar | separate
  claude:
    image:
      repository: ghcr.io/lerenn/llm-proxy-manifestd-adapter-claude
      # Defaults to the chart appVersion (adapter and proxy are released together).
      tag: ""
      pullPolicy: IfNotPresent
    resources: {}
  codex:   # experimental
    image:
      repository: ghcr.io/lerenn/llm-proxy-manifestd-adapter-codex
      tag: ""
      pullPolicy: IfNotPresent
    resources: {}

# Optional Valkey (shared limiter/queue across proxy replicas, needed for the "rolling" topology above).
# Renders one Deployment (1 replica, Recreate, hardened, emptyDir: state loss is acceptable, leases
# expire) and a ClusterIP Service <fullname>-valkey, and injects coordination.valkey.address
# (+ password_env) into the config unless you set `config.coordination` yourself. Downsides: it is a
# single point of failure (see coordination.valkey.fail_mode), a restart loses leases and queue, and
# old/new proxies share it during a rollout.
valkey:
  enabled: false
  image:
    repository: valkey/valkey
    tag: "8.1.11"
    pullPolicy: IfNotPresent
  resources: {}
  # Optional password: exposed as VALKEY_PASSWORD to the proxy and used as --requirepass (never in args).
  existingSecret: {}   # {name: my-secret, key: password}

# Client API keys: when `config.clients` has at least one entry, every /v1/ call
# (and /status) needs a key (`x-api-key: <key>` or `Authorization: Bearer <key>`).
# The `keys-manager` init container (same image, own ServiceAccount + Role limited to that
# Secret) creates the Secret `<release>-client-keys` if absent and adds a random key for each
# client that has none; it never overwrites a key and drops keys of removed clients. The Secret
# is not a Helm/Argo-managed object, so it survives syncs and uninstall. A client added later gets
# its key at the next pod restart. Keys never appear in the ConfigMap. Use `{}` (not null) for a
# client without settings. The API token is mounted only in that init container.
# Escape hatch (GitOps/SOPS): name of an existing Secret whose keys are the client names; the init
# container and RBAC are then not rendered.
clientsExistingSecret: ""

# Rendered as config.yaml (provider pools are merged into `pools`). Changing it hot-reloads the running pods.
config:
  server:
    listen: ":8080"
    queue_timeout: "120s"
    aging_interval: "5s"
  # Add your own pools/endpoints here. With no `providers`, the chart also applies
  # `defaultPools`/`defaultEndpoints` below (the original example config) under yours.
  pools: {}
  # endpoints.<anthropic|openai>.<name>: the name is the `model` clients send;
  # anthropic serves /v1/messages, openai every other /v1/ path.
  #   mode: least-inflight (default) | round-robin | failover
  #   priority: queue priority (default 0), overridable per target
  #   targets: [{pool, target_model, priority?}]  (pools must speak the protocol)
  endpoints: {}
  #   anthropic:
  #     fast:
  #       priority: 10
  #       targets:
  #         - {pool: claude-subscription, target_model: "claude-haiku-5-5@low"}
  #   openai:
  #     standard-medium:
  #       mode: least-inflight
  #       targets:
  #         - {pool: openai-a, target_model: "gpt-5.4"}
  #         - {pool: openai-b, target_model: "gpt-5.4"}
  # clients:          # client API keys (see clientsExistingSecret above)
  #   opencode: {}
  #   ci: {priority: 10, endpoints: [fast]}   # optional default priority / endpoint-name allow-list

# Example pool and endpoints applied only when `providers` is empty (kept so
# that existing installs render the same endpoints). Set both to {} to disable.
defaultPools:
  codex-sub:
    upstream_url: http://cliproxyapi.default.svc.cluster.local:8317
    api_key: "${LOCAL_BRIDGE_KEY}"
    max_concurrency: 2
defaultEndpoints:
  openai:
    codex-interactive: {priority: 100, targets: [{pool: codex-sub, target_model: gpt-5.4}]}
    codex-default: {priority: 50, targets: [{pool: codex-sub, target_model: gpt-5.4}]}
    codex-background: {priority: 10, targets: [{pool: codex-sub, target_model: gpt-5.4}]}
