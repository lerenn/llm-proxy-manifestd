image:
  repository: ghcr.io/lerenn/llm-proxy-manifestd
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Name of an existing Secret whose keys are exposed as environment variables,
# so ${VAR} references in `config` are resolved at load time.
existingSecret: ""

replicaCount: 1

# Pods get this long to finish in-flight streams on shutdown.
terminationGracePeriodSeconds: 600

resources: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: llm-proxy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional second Ingress exposing the public read-only dashboard on its own
# host. The proxy serves the dashboard at "/" for hosts starting with
# "dashboard." (or exactly `config.dashboard.host`), and only the dashboard:
# /v1/... is not reachable through this host. className and annotations fall
# back to the `ingress` values when empty.
dashboard:
  ingress:
    enabled: false
    host: ""            # e.g. dashboard.llm-proxy.example.com
    className: ""
    annotations: {}
    tls: []

# CLI adapter sidecars, one per subscription account (see the "Subscription
# accounts" guide). Each entry renders, in the same pod: one sidecar container
# listening on 127.0.0.1:<port>, one PVC holding its login at /data/claude, and
# a pool of the same name (upstream_url http://localhost:<port>) merged into
# config.pools. Reference the pool from routes as usual. Empty = feature off.
#
# Setting any account forces replicas: 1 and strategy Recreate, disables the
# service account token and runs every container non-root with a read-only
# root filesystem. Adding or removing an account restarts the pod.
#
# accounts:
#   claude-subscription:
#     type: claude            # only "claude" is supported
#     maxConcurrency: 4       # pool max_concurrency (default 4)
#     # port: 9100            # default: accountsBasePort + index in name order
#     # storage: {size: 1Gi, storageClass: ""}   # overrides accountStorage
#     # resources: {}         # overrides adapters.claude.resources
#     # env: []               # extra container env entries
accounts: {}

# First loopback port assigned to accounts (sorted by name, +1 each).
accountsBasePort: 9100

# Defaults for each account's login volume (ReadWriteOnce).
accountStorage:
  size: 1Gi
  storageClass: ""

adapters:
  claude:
    image:
      repository: ghcr.io/lerenn/llm-proxy-manifestd-adapter-claude
      # Defaults to the chart appVersion (adapter and proxy are released together).
      tag: ""
      pullPolicy: IfNotPresent
    resources: {}

# Rendered as config.yaml (account pools are merged into `pools`). Changing it hot-reloads the running pods.
config:
  server:
    listen: ":8080"
    queue_timeout: "120s"
    aging_interval: "5s"
  pools:
    codex-sub:
      upstream_url: http://cliproxyapi.default.svc.cluster.local:8317
      api_key: "${LOCAL_BRIDGE_KEY}"
      max_concurrency: 2
  routes:
    codex-interactive: {pool: codex-sub, target_model: gpt-5.4, priority: 100}
    codex-default: {pool: codex-sub, target_model: gpt-5.4, priority: 50}
    codex-background: {pool: codex-sub, target_model: gpt-5.4, priority: 10}
    # Several pools per route (least in-flight first, failover on 5xx/transport error):
    # standard-medium: {pools: [claude-a, claude-b], target_model: "claude-sonnet-5-5@medium", priority: 50}
