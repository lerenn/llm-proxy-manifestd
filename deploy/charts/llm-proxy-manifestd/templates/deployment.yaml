{{- /*
  Intentionally no checksum/config annotation: the ConfigMap is mounted as a
  directory (no subPath) and the proxy hot-reloads it without a pod restart.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-proxy-manifestd.fullname" . }}
  labels:
    {{- include "llm-proxy-manifestd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "llm-proxy-manifestd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-proxy-manifestd.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: llm-proxy-manifestd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/llm-proxy-manifestd/config.yaml
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/llm-proxy-manifestd
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "llm-proxy-manifestd.fullname" . }}
