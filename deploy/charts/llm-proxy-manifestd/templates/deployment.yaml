{{- /*
  Intentionally no checksum/config annotation: the ConfigMap is mounted as a
  directory (no subPath) and the proxy hot-reloads it without a pod restart.
*/ -}}
{{- $providers := include "llm-proxy-manifestd.providers" . | fromJsonArray -}}
{{- $sidecars := list -}}
{{- $inPod := include "llm-proxy-manifestd.inPodAdapters" . -}}
{{- $separate := include "llm-proxy-manifestd.separate" . -}}
{{- $rollout := include "llm-proxy-manifestd.rollout" . -}}
{{- if $inPod }}{{- range $providers }}{{- if .sidecar }}{{- $sidecars = append $sidecars . }}{{- end }}{{- end }}{{- end -}}
{{- if and (gt (int .Values.replicaCount) 1) (ne $rollout "plain") (ne $rollout "rolling") -}}
{{- fail "replicaCount > 1 with subscription providers (claude/codex) needs adapters.mode=separate AND a shared limiter (valkey.enabled or config.coordination); otherwise the proxy stays at 1 replica" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-proxy-manifestd.fullname" . }}
  labels:
    {{- include "llm-proxy-manifestd.labels" . | nindent 4 }}
spec:
  {{- if $sidecars }}
  # Sidecar providers hold a login on a ReadWriteOnce volume: exactly one pod, and the
  # old pod must be gone before the new one starts (brief outage on rollout).
  replicas: 1
  strategy:
    type: Recreate
  {{- else if eq $rollout "single" }}
  # Separate adapters but no shared limiter (valkey.enabled / config.coordination): a surge pod would
  # double the per-pod concurrency limits, so keep one pod and no overlap.
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "llm-proxy-manifestd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-proxy-manifestd.selectorLabels" . | nindent 8 }}
    spec:
      {{- if include "llm-proxy-manifestd.keysManager" . }}
      serviceAccountName: {{ include "llm-proxy-manifestd.fullname" . }}
      {{- end }}
      {{- if or $sidecars (include "llm-proxy-manifestd.keysManager" .) }}
      # No API token in the main/adapter containers; keys-manager gets its own projected one.
      automountServiceAccountToken: false
      {{- end }}
      {{- if or $sidecars $separate }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if or $providers (include "llm-proxy-manifestd.keysManager" .) }}
      initContainers:
        {{- if include "llm-proxy-manifestd.keysManager" . }}
        # Creates the client keys Secret if absent and adds a key for each client without one
        # (never overwrites; drops keys of removed clients). Runs before the proxy starts.
        - name: keys-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/keys-manager"]
          args:
            - init
            {{- if include "llm-proxy-manifestd.clientKeysManager" . }}
            - --config=/etc/llm-proxy-manifestd/config.yaml
            - --secret={{ include "llm-proxy-manifestd.clientKeysSecret" . }}
            {{- end }}
            {{- if $separate }}
            - --adapter-token-secret={{ include "llm-proxy-manifestd.adapterTokenSecret" . }}
            {{- end }}
            - --namespace={{ .Release.Namespace }}
            {{- range $k, $v := (include "llm-proxy-manifestd.labels" . | fromYaml) }}
            - --label={{ $k }}={{ $v }}
            {{- end }}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/llm-proxy-manifestd
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        {{- end }}
        {{- if $providers }}
        # Fail the rollout early on an invalid config (pools, endpoints).
        - name: check-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/checker"]
          args: ["-f", "/etc/llm-proxy-manifestd/config.yaml"]
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/llm-proxy-manifestd
              readOnly: true
          {{- if include "llm-proxy-manifestd.clientKeysEnabled" . }}
            - name: client-keys
              mountPath: {{ include "llm-proxy-manifestd.clientKeysPath" . }}
              readOnly: true
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: llm-proxy-manifestd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/llm-proxy-manifestd/config.yaml
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          {{- $apis := list }}
          {{- range $providers }}{{- if not .sidecar }}{{- $apis = append $apis . }}{{- end }}{{- end }}
          {{- if or $apis $separate (and (.Values.valkey).enabled (.Values.valkey.existingSecret).name) }}
          env:
            {{- if $separate }}
            # Shared adapter token (created by the keys-manager init container), sent to the
            # adapters as the pools' upstream api key (Authorization: Bearer).
            - name: ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-proxy-manifestd.adapterTokenSecret" . }}
                  key: token
                  optional: false
            {{- end }}
            {{- if and (.Values.valkey).enabled (.Values.valkey.existingSecret).name }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.existingSecret.name }}
                  key: {{ .Values.valkey.existingSecret.key | default "password" }}
                  optional: false
            {{- end }}
            {{- range $apis }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
                  optional: false
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            preStop:
              # Native sleep: the distroless proxy image has no `sleep` binary (an exec hook fails and the pod
              # would be killed before endpoints propagate).
              sleep:
                seconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $sidecars $separate }}
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/llm-proxy-manifestd
              readOnly: true
          {{- if include "llm-proxy-manifestd.clientKeysEnabled" . }}
            - name: client-keys
              mountPath: {{ include "llm-proxy-manifestd.clientKeysPath" . }}
              readOnly: true
          {{- end }}
        {{- range $sidecars }}
        {{- $a := .provider }}
        {{- $ad := get $.Values.adapters .type }}
        {{- $img := $ad.image }}
        # Provider {{ .name }}: loopback-only adapter; its pool in the ConfigMap
        # points at http://localhost:{{ .port }}.
        - name: {{ .name }}
          image: "{{ $img.repository }}:{{ $img.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $img.pullPolicy }}
          env:
            - name: ADAPTER_TYPE
              value: {{ .type | quote }}
            - name: ADAPTER_LISTEN
              value: "127.0.0.1:{{ .port }}"
            - name: ADAPTER_SHUTDOWN_TIMEOUT
              value: {{ printf "%ds" (sub (int $.Values.terminationGracePeriodSeconds) 5) | quote }}
            - name: {{ .homeEnv }}
              value: {{ .dataDir }}
            {{- with $a.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          lifecycle:
            preStop:
              # Native sleep: the distroless proxy image has no `sleep` binary (an exec hook fails and the pod
              # would be killed before endpoints propagate).
              sleep:
                seconds: 3
          # No readinessProbe on purpose: an adapter that is not logged in
          # must not make the whole pod NotReady (the Service would lose its
          # endpoints, taking api pools and failover targets down with it).
          # `adapter-<type> ready` is still used by lpmctl status.
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with ($a.resources | default $ad.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: login-{{ .name }}
              mountPath: {{ .dataDir }}
            - name: tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "llm-proxy-manifestd.fullname" . }}
        {{- if include "llm-proxy-manifestd.clientKeysEnabled" . }}
        - name: client-keys
          secret:
            secretName: {{ include "llm-proxy-manifestd.clientKeysSecret" . }}
            defaultMode: 0440
            {{- if include "llm-proxy-manifestd.keysManager" . }}
            # Created at runtime by the keys-manager init container: the volume
            # must not block pod start (deadlock). Required for a user-owned Secret.
            optional: true
            {{- end }}
        {{- end }}
        {{- if include "llm-proxy-manifestd.keysManager" . }}
        # API token for the keys-manager init container ONLY.
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        {{- end }}
        {{- if $sidecars }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- range $sidecars }}
        - name: login-{{ .name }}
          persistentVolumeClaim:
            claimName: {{ include "llm-proxy-manifestd.fullname" $ }}-{{ .name }}
        {{- end }}
