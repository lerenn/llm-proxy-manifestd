apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-proxy-manifestd.fullname" . }}
  labels:
    {{- include "llm-proxy-manifestd.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $cfg := deepCopy .Values.config }}
    {{- $pools := deepCopy (get $cfg "pools" | default dict) }}
    {{- range (include "llm-proxy-manifestd.accounts" . | fromJsonArray) }}
    {{- if hasKey $pools .name }}
    {{- fail (printf "accounts.%s conflicts with a pool of the same name in config.pools" .name) }}
    {{- end }}
    {{- $_ := set $pools .name (dict "upstream_url" (printf "http://localhost:%d" (int .port)) "max_concurrency" (int .maxConcurrency)) }}
    {{- end }}
    {{- if $pools }}
    {{- $_ := set $cfg "pools" $pools }}
    {{- end }}
    {{- toYaml $cfg | nindent 4 }}
