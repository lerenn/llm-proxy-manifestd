apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-proxy-manifestd.fullname" . }}
  labels:
    {{- include "llm-proxy-manifestd.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $providers := include "llm-proxy-manifestd.providers" . | fromJsonArray }}
    {{- $cfg := deepCopy .Values.config }}
    {{- $pools := deepCopy (get $cfg "pools" | default dict) }}
    {{- if not $providers }}
    {{- $pools = merge $pools (deepCopy .Values.defaultPools) }}
    {{- $_ := set $cfg "routes" (merge (deepCopy (get $cfg "routes" | default dict)) (deepCopy .Values.defaultRoutes)) }}
    {{- end }}
    {{- range $providers }}
    {{- if hasKey $pools .name }}
    {{- fail (printf "providers.%s conflicts with a pool of the same name in config.pools" .name) }}
    {{- end }}
    {{- if .sidecar }}
    {{- $pool := dict "upstream_url" (printf "http://localhost:%d" (int .port)) "max_concurrency" (int .maxConcurrency) "protocol" "anthropic" }}
    {{- $_ := set $pools .name $pool }}
    {{- else }}
    {{- $pool := dict "upstream_url" .url "max_concurrency" (int .maxConcurrency) "protocol" .protocol "api_key" (printf "${%s}" .envName) }}
    {{- $_ := set $pools .name $pool }}
    {{- end }}
    {{- end }}
    {{- if $pools }}
    {{- $_ := set $cfg "pools" $pools }}
    {{- end }}
    {{- toYaml $cfg | nindent 4 }}
