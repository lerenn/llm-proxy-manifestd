apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-proxy-manifestd.fullname" . }}
  labels:
    {{- include "llm-proxy-manifestd.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $providers := include "llm-proxy-manifestd.providers" . | fromJsonArray }}
    {{- if hasKey .Values "defaultRoutes" }}
    {{- fail "`defaultRoutes` was replaced by `defaultEndpoints` (endpoints.<anthropic|openai>.<name>: {targets: [{pool, target_model}]}): please migrate your values" }}
    {{- end }}
    {{- if hasKey .Values.config "routes" }}
    {{- fail "`config.routes` was replaced by `config.endpoints` (endpoints.<anthropic|openai>.<name>: {mode, priority, targets: [{pool, target_model}]}); see the Protocol endpoints guide" }}
    {{- end }}
    {{- $cfg := deepCopy .Values.config }}
    {{- $pools := deepCopy (get $cfg "pools" | default dict) }}
    {{- if not $providers }}
    {{- $pools = merge $pools (deepCopy .Values.defaultPools) }}
    {{- $_ := set $cfg "endpoints" (merge (deepCopy (get $cfg "endpoints" | default dict)) (deepCopy (.Values.defaultEndpoints | default dict))) }}
    {{- end }}
    {{- range $providers }}
    {{- $prov := . }}
    {{- if .sidecar }}
    {{- if hasKey $pools .name }}
    {{- fail (printf "providers.%s conflicts with a pool of the same name in config.pools" .name) }}
    {{- end }}
    {{- $pool := dict "upstream_url" (printf "http://localhost:%d" (int .port)) "max_concurrency" (int .maxConcurrency) "protocol" .protocol }}
    {{- if include "llm-proxy-manifestd.separate" $ }}
    {{- $pool = dict "upstream_url" (printf "http://%s-%s:%d" (include "llm-proxy-manifestd.fullname" $) .name (int .port)) "max_concurrency" (int .maxConcurrency) "protocol" .protocol "api_key" "${ADAPTER_TOKEN}" "auth" "bearer" }}
    {{- end }}
    {{- $_ := set $pools .name $pool }}
    {{- else }}
    {{- range .apiPools }}
    {{- if hasKey $pools .name }}
    {{- fail (printf "providers.%s: pool %s conflicts with a pool of the same name in config.pools or another provider" $prov.name .name) }}
    {{- end }}
    {{- $pool := dict "upstream_url" $prov.url "max_concurrency" (int $prov.maxConcurrency) "protocol" .protocol "api_key" (printf "${%s}" $prov.envName) }}
    {{- if $prov.group }}
    {{- $_ := set $pool "concurrency_group" $prov.group }}
    {{- end }}
    {{- if $prov.auth }}
    {{- $_ := set $pool "auth" $prov.auth }}
    {{- end }}
    {{- $_ := set $pools .name $pool }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if $pools }}
    {{- $_ := set $cfg "pools" $pools }}
    {{- end }}
    {{- if and (.Values.valkey).enabled (not $cfg.coordination) }}
    {{- $vk := dict "address" (printf "%s:6379" (include "llm-proxy-manifestd.valkeyName" .)) }}
    {{- if (.Values.valkey.existingSecret).name }}
    {{- $_ := set $vk "password_env" "VALKEY_PASSWORD" }}
    {{- end }}
    {{- $_ := set $cfg "coordination" (dict "valkey" $vk) }}
    {{- end }}
    {{- if include "llm-proxy-manifestd.clientKeysEnabled" . }}
    {{- $server := deepCopy (get $cfg "server" | default dict) }}
    {{- $_ := set $server "client_keys_dir" (include "llm-proxy-manifestd.clientKeysPath" .) }}
    {{- $_ := set $cfg "server" $server }}
    {{- end }}
    {{- toYaml $cfg | nindent 4 }}
