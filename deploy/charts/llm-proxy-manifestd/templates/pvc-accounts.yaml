{{- range (include "llm-proxy-manifestd.accounts" . | fromJsonArray) }}
{{- $st := .account.storage | default dict }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-proxy-manifestd.fullname" $ }}-{{ .name }}
  labels:
    {{- include "llm-proxy-manifestd.labels" $ | nindent 4 }}
    app.kubernetes.io/component: account-{{ .name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with ($st.storageClass | default $.Values.accountStorage.storageClass) }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $st.size | default $.Values.accountStorage.size }}
{{- end }}
