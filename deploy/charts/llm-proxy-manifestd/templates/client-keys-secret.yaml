{{- if and (include "llm-proxy-manifestd.clientKeysEnabled" .) (not .Values.clientsExistingSecret) }}
{{- /*
  One random key per client name, generated on first install and reused on
  upgrades through `lookup` (existing values win; new names get a new key;
  removed names are dropped). `lookup` returns nothing under `helm template`,
  `--dry-run` and Argo CD (which renders with `helm template`): there every
  render produces NEW random keys, so in those setups use
  clientsExistingSecret instead.
*/ -}}
{{- $name := include "llm-proxy-manifestd.clientKeysSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if $existing }}{{- $old = $existing.data | default dict }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "llm-proxy-manifestd.labels" . | nindent 4 }}
  annotations:
    # Keep the keys if the release is uninstalled by mistake.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $client := keys .Values.config.clients | sortAlpha }}
  {{ $client }}: {{ get $old $client | default (printf "llmp_%s" (randAlphaNum 40) | b64enc) }}
  {{- end }}
{{- end }}
