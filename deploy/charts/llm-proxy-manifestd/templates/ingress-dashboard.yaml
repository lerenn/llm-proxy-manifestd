{{- if and .Values.dashboard.ingress.enabled .Values.dashboard.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "llm-proxy-manifestd.fullname" . }}-dashboard
  labels:
    {{- include "llm-proxy-manifestd.labels" . | nindent 4 }}
  {{- with (default .Values.ingress.annotations .Values.dashboard.ingress.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with (default .Values.ingress.className .Values.dashboard.ingress.className) }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.dashboard.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.dashboard.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "llm-proxy-manifestd.fullname" . }}
                port:
                  name: http
{{- end }}
