name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (go test -race)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: test

  valkey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Coordination tests against a real Valkey
        env:
          LPM_TEST_VALKEY: 127.0.0.1:6379
        run: go test -race -count=1 -run 'Shared' ./internal/pool

  adapter-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        adapter: [codex]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.adapter }} adapter image
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: build-adapter --name=${{ matrix.adapter }}

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile lpmctl (linux/darwin, amd64/arm64)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: build-cli entries

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Helm lint and template tests
        run: |
          helm lint deploy/charts/llm-proxy-manifestd
          deploy/charts/test.sh

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
