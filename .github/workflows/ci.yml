name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (go test -race)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: test

  adapter-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        adapter: [claude, codex]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.adapter }} adapter image
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: build-adapter --name=${{ matrix.adapter }}

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile lpmctl (linux/darwin, amd64/arm64)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: build-cli entries

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Helm lint and template tests
        run: |
          helm lint deploy/charts/llm-proxy-manifestd
          deploy/charts/test.sh

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
