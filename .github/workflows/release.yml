name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish image
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.19.8"
          verb: call
          args: publish-image --tag=${{ github.ref_name }} --registry-user=lerenn --registry-token=env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish chart
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.19.8"
          verb: call
          args: publish-chart --version=${{ github.ref_name }} --registry-user=lerenn --registry-token=env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
