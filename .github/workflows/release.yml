name: Release

# Manual releases only: pushing a v* tag by hand (with a user token) publishes it.
# Tags created by auto-release.yml use GITHUB_TOKEN and therefore do NOT trigger
# this workflow (GitHub does not start workflows from GITHUB_TOKEN events),
# so there is no double publishing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub Release + lpmctl assets
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish image
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: publish-image --tag=${{ github.ref_name }} --registry-user=lerenn --registry-token=env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Codex adapter image
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: publish-adapter-image --name=codex --tag=${{ github.ref_name }} --registry-user=lerenn --registry-token=env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish chart
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: publish-chart --version=${{ github.ref_name }} --registry-user=lerenn --registry-token=env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build lpmctl release binaries
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.11"
          verb: call
          args: build-cli --version=${{ github.ref_name }} export --path=dist
      - name: Attach lpmctl binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" --verify-tag --generate-notes --title "${VERSION}"
          fi
          gh release upload "${VERSION}" dist/* --clobber
